databases:
  - name: smart-expense-tracker-db
    databaseName: smart_expense_tracker
    user: smart_expense_tracker
    plan: free
    region: oregon

services:
  - type: web
    name: smart-expense-subscription-tracker-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smart-expense-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://omlendal.github.io,http://localhost:5173
